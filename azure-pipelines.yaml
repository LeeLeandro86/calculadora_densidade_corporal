trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*
      - '*.md'

pr:
  branches:
    include:
      - main
      - develop

variables:
  buildConfiguration: 'release'

stages:
  - stage: Build
    displayName: 'Build & Test Stage'
    jobs:
      - job: BuildAndroid
        displayName: 'Build Android (APK)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              echo "📥 Downloading Flutter SDK..."
              git clone https://github.com/flutter/flutter.git --branch stable --depth 1 ~/flutter
              export PATH="$HOME/flutter/bin:$PATH"
              flutter --version
              flutter doctor
            displayName: 'Install Flutter SDK'

          - bash: |
              export PATH="$HOME/flutter/bin:$PATH"
              echo "📦 Getting dependencies..."
              flutter pub get
            displayName: 'Get Flutter Dependencies'

          - bash: |
              export PATH="$HOME/flutter/bin:$PATH"
              echo "🔧 Generating Android platform files if needed..."
              if [ ! -d "android" ]; then
                echo "Android folder not found, generating..."
                flutter create . --platforms android
              else
                echo "Android folder exists, skipping generation..."
              fi
            displayName: 'Setup Android Platform'
            continueOnError: true

          - bash: |
              export PATH="$HOME/flutter/bin:$PATH"
              echo "🔍 Running analyzer..."
              flutter analyze || true
            displayName: 'Run Flutter Analyzer'
            continueOnError: true

          - bash: |
              export PATH="$HOME/flutter/bin:$PATH"
              echo "🧪 Running tests with coverage..."
              flutter test --coverage || true
            displayName: 'Run Widget Tests'
            continueOnError: true

          - bash: |
              export PATH="$HOME/flutter/bin:$PATH"
              echo "🔨 Building APK Release..."
              flutter build apk --release
            displayName: 'Build APK (Release)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish APK Artifact'
            condition: succeeded()
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/build/app/outputs/flutter-apk/'
              ArtifactName: 'calculadora-apk-$(Build.BuildId)'
              publishLocation: 'Container'

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Build.SourcesDirectory)/coverage/lcov.info'
              failIfCoverageEmpty: false



  - stage: Summary
    displayName: 'Build Summary'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PublishSummary
        displayName: 'Display Build Results'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - bash: |
              echo "##[group]✅ BUILD SUMMARY"
              echo "📱 Android APK: calculadora-apk-$(Build.BuildId)"
              echo "Build ID: $(Build.BuildId)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Status: SUCCESS ✅"
              echo "##[endgroup]"
            displayName: 'Display Artifact Summary'
